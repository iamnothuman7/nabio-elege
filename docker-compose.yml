version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nabio_elege_db
    environment:
      POSTGRES_USER: nabio_user
      POSTGRES_PASSWORD: nabio_password
      POSTGRES_DB: nabio_elege
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nabio_elege_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
