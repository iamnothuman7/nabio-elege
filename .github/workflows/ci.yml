name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - settings: test_settings
            python: "3.11"
            postgres: "postgres:15-alpine"
          - settings: postgres_test_settings
            python: "3.12"
            postgres: "postgres:14-alpine"
          - settings: postgres_test_settings
            python: "3.12"
            postgres: "postgres:15-alpine"
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_DB: nabio_test
          POSTGRES_USER: nabio_test
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nabio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nabio_test:ci-only-test-password@127.0.0.1:5432/nabio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-production.txt
      - run: python -m compileall -q apps nabio_elege
      - run: python manage.py check --settings=nabio_elege.${{ matrix.settings }}
      - run: python manage.py makemigrations --check --dry-run --settings=nabio_elege.${{ matrix.settings }}
      - run: python manage.py test --settings=nabio_elege.${{ matrix.settings }}
