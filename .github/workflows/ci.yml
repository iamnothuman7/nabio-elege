name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - settings: test_settings
            python: "3.11"
            postgres: "postgres:15-alpine"
          - settings: postgres_test_settings
            python: "3.12"
            postgres: "postgres:14-alpine"
          - settings: postgres_test_settings
            python: "3.12"
            postgres: "postgres:15-alpine"
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_DB: nabio_test
          POSTGRES_USER: nabio_test
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nabio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nabio_test:ci-only-test-password@127.0.0.1:5432/nabio_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python infra/check_dependency_lock.py
      - run: python -m pip install -r requirements-production.lock
      - run: python -m pip check
      - run: python -m compileall -q apps nabio_elege
      - run: python manage.py check --settings=nabio_elege.${{ matrix.settings }}
      - run: python manage.py makemigrations --check --dry-run --settings=nabio_elege.${{ matrix.settings }}
      - run: python manage.py test --settings=nabio_elege.${{ matrix.settings }}
      - run: python manage.py check_templates --settings=nabio_elege.${{ matrix.settings }}
      - run: node --test infra/ui_interactions.test.cjs
      - run: python manage.py collectstatic --noinput --settings=nabio_elege.${{ matrix.settings }}

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1 ruff==0.16.8
      - run: ruff check --select E9,F63,F7,F82 apps nabio_elege infra
      - name: Check formatting of new security and release modules
        run: ruff format --check apps/workspace/account_forms.py apps/workspace/legal_access.py apps/workspace/legal_views.py apps/workspace/test_accounts.py apps/workspace/test_legal_access.py apps/workspace/management/commands/bootstrap_operator.py apps/core/test_release.py apps/core/management/commands/check_templates.py infra/check_dependency_lock.py
      - name: Check formatting of isolation modules
        run: ruff format --check apps/core/rls.py apps/core/rls_schema_v1.py apps/core/scope_middleware.py apps/core/test_rls.py apps/core/management/commands/check_rls.py
      - name: Check formatting of trusted proxy handling
        run: ruff format --check apps/core/client_address.py apps/core/test_client_address.py
      - name: Check formatting of brand regression tests
        run: ruff format --check apps/workspace/test_brand.py
      - run: python -m pip_audit -r requirements-production.lock --require-hashes --strict --progress-spinner off --timeout 20
      - name: Scan full Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact=100 --no-banner

  artifact:
    needs: [test, security]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Package only tracked release source
        run: |
          git archive --format=tar.gz --output=nabio-elege-${{ github.sha }}.tar.gz HEAD
          sha256sum nabio-elege-${{ github.sha }}.tar.gz > nabio-elege-${{ github.sha }}.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nabio-elege-${{ github.sha }}
          path: |
            nabio-elege-*.tar.gz
            nabio-elege-*.tar.gz.sha256
          retention-days: 14
