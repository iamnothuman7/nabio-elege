name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check --settings=nabio_elege.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=nabio_elege.test_settings
      - run: python manage.py test --settings=nabio_elege.test_settings
