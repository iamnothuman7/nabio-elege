{% if page.has_other_pages %}<nav class="platform-pagination" aria-label="Páginas da seção"><span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span>{% if page.has_previous %}<a href="?q={{ query|urlencode }}&amp;days={{ usage.days|default:7 }}&amp;{{ parameter }}={{ page.previous_page_number }}">Anterior</a>{% endif %}{% if page.has_next %}<a href="?q={{ query|urlencode }}&amp;days={{ usage.days|default:7 }}&amp;{{ parameter }}={{ page.next_page_number }}">Próxima</a>{% endif %}</nav>{% endif %}
