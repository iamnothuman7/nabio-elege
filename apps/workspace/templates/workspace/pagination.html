<div class="pagination"><span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span><div>{% if sensitive_search %}<form method="post">{% csrf_token %}<input type="hidden" name="q" value="{{ query }}"><input type="hidden" name="status" value="{{ selected_status }}">{% if page.has_previous %}<button class="button secondary small" name="page" value="{{ page.previous_page_number }}">← Anterior</button>{% endif %}{% if page.has_next %}<button class="button secondary small" name="page" value="{{ page.next_page_number }}">Próxima →</button>{% endif %}</form>{% else %}{% if page.has_previous %}<a class="button secondary small" href="?page={{ page.previous_page_number }}&amp;q={{ query|urlencode }}&amp;status={{ selected_status|urlencode }}">← Anterior</a>{% endif %}{% if page.has_next %}<a class="button secondary small" href="?page={{ page.next_page_number }}&amp;q={{ query|urlencode }}&amp;status={{ selected_status|urlencode }}">Próxima →</a>{% endif %}{% endif %}</div></div>
