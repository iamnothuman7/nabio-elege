{% extends 'workspace/base.html' %}{% block content %}<section class="page-heading"><div><div class="eyebrow">SUPRIMENTOS</div><h1>Movimentar estoque</h1><p>O saldo disponível é conferido antes de cada saída.</p></div></section><section class="panel form-panel"><form method="post">{% csrf_token %}<input type="hidden" name="command_id" value="{{ command_id }}"><div class="form-grid"><label>Item<select name="item" required>{% for item in items %}<option value="{{ item.id }}">{{ item.name }} · {{ item.unit }}</option>{% endfor %}</select></label><label>Depósito<select name="warehouse" required>{% for warehouse in warehouses %}<option value="{{ warehouse.id }}">{{ warehouse.name }}</option>{% endfor %}</select></label><label>Tipo de movimento<select name="kind"><option value="entry">Entrada</option><option value="exit">Saída</option><option value="return">Devolução</option></select></label><label>Quantidade<input type="number" name="quantity" min="0.0001" step="0.0001" required></label><label class="full">Motivo<textarea name="reason" minlength="3" maxlength="500" required rows="3"></textarea></label></div><div class="form-footer"><a class="button secondary" href="{% url 'module_list' campaign.id 'itens' %}">Voltar</a><button class="button">Registrar movimento</button></div></form></section>{% endblock %}
